  <script>
  (function () {
    'use strict';

    var KEY = 'ixcprovedor_cookie_consent';
    var POLITICA = 'https://ixcsoft.com/politica-de-privacidade/';

    function guardado() {
      try { return localStorage.getItem(KEY); } catch (e) { return null; }
    }

    window.dataLayer = window.dataLayer || [];
    if (typeof window.gtag !== 'function') {
      window.gtag = function () { window.dataLayer.push(arguments); };
    }
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      functionality_storage: 'granted',
      security_storage: 'granted',
      wait_for_update: 500
    });

    window._hsp = window._hsp || [];

    function aplicar(status) {
      var ok = status === 'granted';
      gtag('consent', 'update', {
        ad_storage: ok ? 'granted' : 'denied',
        ad_user_data: ok ? 'granted' : 'denied',
        ad_personalization: ok ? 'granted' : 'denied',
        analytics_storage: ok ? 'granted' : 'denied'
      });
      window._hsp.push(['setHubSpotConsent',
        { analytics: ok, advertisement: ok, functionality: ok }]);
      window.dataLayer.push({ event: 'cookie_consent', cookie_consent_status: status });
    }

    var escolha = guardado();
    if (escolha) {
      aplicar(escolha);
    } else {
      window._hsp.push(['setHubSpotConsent',
        { analytics: false, advertisement: false, functionality: false }]);
    }

    window.setCookieConsent = function (status) {
      try { localStorage.setItem(KEY, status); } catch (e) {}
      aplicar(status);
      var el = document.getElementById('cookie-banner');
      if (el) el.classList.remove('is-visible');
    };

    if (escolha) return;

    function montar() {
      if (document.getElementById('cookie-banner')) return;

      var css = document.createElement('style');
      css.textContent =
        '#cookie-banner{position:fixed;left:0;right:0;bottom:0;z-index:2147483000;' +
        'background:#0f1115;border-top:1px solid rgba(255,255,255,.14);' +
        'box-shadow:0 -8px 30px -18px rgba(0,0,0,.8);transform:translateY(110%);' +
        'transition:transform .4s ease;font:inherit}' +
        '#cookie-banner.is-visible{transform:translateY(0)}' +
        '#cookie-banner .ci{max-width:1200px;margin:0 auto;padding:20px 24px;display:flex;' +
        'flex-direction:column;gap:16px;align-items:flex-start}' +
        '#cookie-banner p{margin:0;color:#e6e6e6;font-size:14px;line-height:1.55;font-family:inherit}' +
        '#cookie-banner a{color:#fff;text-decoration:underline}' +
        '#cookie-banner .ca{display:flex;gap:12px;flex-wrap:wrap;width:100%}' +
        '#cookie-banner button{font:inherit;font-size:14px;font-weight:700;border-radius:999px;' +
        'padding:11px 26px;cursor:pointer;border:1px solid transparent;transition:opacity .2s ease}' +
        '#cookie-banner .ok{background:#fff;color:#0f1115}' +
        '#cookie-banner .ok:hover{opacity:.88}' +
        '#cookie-banner .no{background:transparent;color:#e6e6e6;border-color:rgba(255,255,255,.28)}' +
        '#cookie-banner .no:hover{background:rgba(255,255,255,.08)}' +
        '#cookie-banner button:focus-visible{outline:2px solid #fff;outline-offset:2px}' +
        '@media(min-width:768px){#cookie-banner .ci{flex-direction:row;align-items:center;' +
        'justify-content:space-between;gap:32px}#cookie-banner .ca{width:auto;flex-shrink:0}}';
      document.head.appendChild(css);

      var el = document.createElement('div');
      el.id = 'cookie-banner';
      el.setAttribute('role', 'dialog');
      el.setAttribute('aria-live', 'polite');
      el.setAttribute('aria-label', 'Aviso de cookies');
      el.innerHTML =
        '<div class="ci"><p>Utilizamos cookies para melhorar sua experiência, analisar o tráfego e ' +
        'personalizar conteúdo. Ao continuar navegando, você concorda com nossa ' +
        '<a href="' + POLITICA + '" target="_blank" rel="noopener">Política de Privacidade</a>.</p>' +
        '<div class="ca"><button type="button" class="no">Rejeitar</button>' +
        '<button type="button" class="ok">Aceitar cookies</button></div></div>';
      document.body.appendChild(el);

      el.querySelector('.ok').addEventListener('click', function () { setCookieConsent('granted'); });
      el.querySelector('.no').addEventListener('click', function () { setCookieConsent('denied'); });
      setTimeout(function () { el.classList.add('is-visible'); }, 600);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', montar);
    } else {
      montar();
    }
  })();

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T5DJ5B9K"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <!-- Mobile Navigation Backdrop Overlay -->
  <div id="mobile-menu-overlay" class="mobile-menu-overlay" aria-hidden="true"></div>

  <!-- Mobile Navigation Drawer Menu -->
  <div id="mobile-menu" class="header-mobile-menu hidden">
    <!-- Header do Menu Mobile -->
    <div class="mobile-menu-header">
      <a href="../#home" class="mobile-menu-logo" aria-label="Home Olli">
        <img src="../assets/shared/logo-olli.svg" alt="Olli" class="header-logo-img" />
      </a>
      <button id="mobile-menu-close" type="button" class="mobile-menu-close" aria-label="Fechar menu">
        <svg class="header-mobile-icon-close" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Navegação Mobile -->
    <nav class="mobile-navigation" aria-label="Navegação Mobile">
      <a href="../#home" class="header-mobile-link">Home</a>
      <a href="../#servicos" class="header-mobile-link">Serviços</a>
      <a href="../#encontre" class="header-mobile-link">Encontre a Olli</a>
    </nav>

    <a href="../#contato" class="primary-button header-primary-cta mobile-menu-cta">
      <span class="header-primary-cta-text">Quero ser um parceiro</span>
    </a>
  </div>

  <!-- ========================================== -->
  <!-- HEADER / NAVBAR                            -->
  <!-- ========================================== -->
  <header id="header" class="site-header">
    <div class="header-container">

      <!-- Left Zone: Brand Logo -->
      <div class="header-left">
        <a href="../#home" class="header-logo" aria-label="Home Olli">
          <img src="../assets/shared/logo-olli.svg" alt="Olli" class="header-logo-img" />
        </a>
      </div>

      <!-- Center Zone: Desktop Navigation Links -->
      <nav class="header-center header-nav" aria-label="Navegação Principal">
        <a href="../#home" class="header-nav-link">Home</a>
        <a href="../#servicos" class="header-nav-link">Serviços</a>
        <a href="../#encontre" class="header-nav-link">Encontre a Olli</a>
      </nav>

      <!-- Right Zone: Desktop CTA Primary Button -->
      <div class="header-right header-desktop-cta-wrapper">
        <a href="../#contato" class="primary-button header-primary-cta">
          <span class="header-primary-cta-text">Quero ser um parceiro</span>
        </a>
      </div>

      <!-- Mobile Toggle Action Button -->
      <div class="header-actions">
        <button id="mobile-menu-btn" type="button" class="header-cta header-mobile-toggle"
          aria-label="Abrir menu de navegação" aria-expanded="false" aria-controls="mobile-menu">
          <svg id="menu-icon-bars" class="header-mobile-icon-bars" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
          <svg id="menu-icon-close" class="header-mobile-icon-close hidden" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- ========================================== -->
  <!-- CONTEÚDO PRINCIPAL (FORMULÁRIO TALLY)       -->
  <!-- ========================================== -->
  <main class="account-removal-main">
    <!-- Ambient Background Particles -->
    <div class="ambient-particles" aria-hidden="true">
      <div class="ambient-particle ambient-particle-1"></div>
      <div class="ambient-particle ambient-particle-2"></div>
      <div class="ambient-particle ambient-particle-3"></div>
      <div class="ambient-particle ambient-particle-4"></div>
    </div>

    <div class="account-removal-container">
      <div class="tally-iframe-wrapper">
        <iframe
          data-tally-src="https://tally.so/r/w5dLLN?transparentBackground=1"
          width="100%"
          height="100%"
          frameborder="0"
          marginheight="0"
          marginwidth="0"
          title="Exclusão da conta e dados pessoais da Olli">
        </iframe>
      </div>
    </div>
  </main>

  <!-- ========================================== -->
  <!-- FOOTER COMPONENT                           -->
  <!-- ========================================== -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-bottom">
        <div class="footer-bottom-brand">
          <a href="../#home" class="footer-brand" aria-label="Home Olli">
            <img src="../assets/shared/logo-olli.svg" alt="Olli" class="footer-olli-logo" width="82" height="22" />
          </a>
        </div>

        <p class="footer-copyright">
          &copy; 2026 Olli. Todos os direitos reservados.
        </p>
      </div>
    </div>
  </footer>

  <!-- Script for Interactive Header & Mobile Navigation -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuBtn = document.getElementById('mobile-menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      const mobileMenuCloseBtn = document.getElementById('mobile-menu-close');
      const mobileMenuLogo = document.querySelector('.mobile-menu-logo');
      const iconBars = document.getElementById('menu-icon-bars');
      const iconClose = document.getElementById('menu-icon-close');
      const mobileLinks = document.querySelectorAll('.header-mobile-link');
      const header = document.getElementById('header');
      const overlay = document.getElementById('mobile-menu-overlay');

      const openMobileMenu = () => {
        if (menuBtn) menuBtn.setAttribute('aria-expanded', 'true');
        if (mobileMenu) mobileMenu.classList.remove('hidden');
        if (iconBars) iconBars.classList.add('hidden');
        if (iconClose) iconClose.classList.remove('hidden');
        if (overlay) overlay.classList.add('active');
        document.body.classList.add('menu-open');
        document.documentElement.classList.add('menu-open');
      };

      const closeMobileMenu = () => {
        if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
        if (mobileMenu) mobileMenu.classList.add('hidden');
        if (iconBars) iconBars.classList.remove('hidden');
        if (iconClose) iconClose.classList.add('hidden');
        if (overlay) overlay.classList.remove('active');
        document.body.classList.remove('menu-open');
        document.documentElement.classList.remove('menu-open');
      };

      if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', () => {
          const isExpanded = menuBtn.getAttribute('aria-expanded') === 'true';
          if (isExpanded) {
            closeMobileMenu();
          } else {
            openMobileMenu();
          }
        });

        if (mobileMenuCloseBtn) {
          mobileMenuCloseBtn.addEventListener('click', closeMobileMenu);
        }

        if (mobileMenuLogo) {
          mobileMenuLogo.addEventListener('click', closeMobileMenu);
        }

        mobileLinks.forEach(link => {
          link.addEventListener('click', closeMobileMenu);
        });

        if (overlay) {
          overlay.addEventListener('click', closeMobileMenu);
        }

        window.addEventListener('resize', () => {
          if (window.innerWidth >= 768 && menuBtn.getAttribute('aria-expanded') === 'true') {
            closeMobileMenu();
          }
        });
      }

      // Add dynamic background shadow/effect on scroll
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }
      }, { passive: true });
    });
  </script>
</body>

</html>
